<title>Aphasia Handout Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
/* Layout: one column. A drop zone at the top; below it the handout pages, drawn like the printed
   UNC handouts (letter-size sheets, a title per page, a big picture beside each line, bold key words). */
:root {
  /* One deliberate light look: white page, navy accent, cool greys. */
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --panel: #f6f8fb;
  --ink: #16202e;
  --muted: #5a6577;
  --line: #d6dde8;
  --accent: #1d4e89;
  --accent-ink: #ffffff;
  --accent-soft: #e9f0f9;
  --ok: #1b6e45;
  --ok-soft: #eaf6ef;
  --bad: #b42318;
  --bad-soft: #fdeceb;
  --sheet: #ffffff;
  --sheet-ink: #111827;
  --font: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
/* Upload */
.drop { background: var(--panel); border: 2px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.drop.over { border-color: var(--accent); }
.drop h1 { margin: 0; font-size: 22px; }
.drop p { margin: 0; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
button, .filebtn { font: inherit; font-weight: 700; border-radius: 10px; padding: 11px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .55; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 2px; color: var(--accent); font-weight: 400; text-decoration: underline; }
select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.disclaimer { margin: 0; font-size: 14px; color: var(--muted); text-align: center; max-width: 64ch; justify-self: center; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
textarea { width: 100%; min-height: 180px; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.status { min-height: 1.4em; color: var(--muted); }
.status.err { color: var(--bad); font-weight: 700; }
/* Result bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.bar.pass { background: var(--ok-soft); } .bar.fail { background: var(--bad-soft); }
.verdict { font-weight: 700; }
.bar.pass .verdict { color: var(--ok); } .bar.fail .verdict { color: var(--bad); }
.problems { margin: 0; padding: 10px 14px 10px 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
.problems li { margin: 2px 0; }
/* Handout sheets — the printed look */
.sheets { display: grid; gap: 20px; }
.sheet { background: var(--sheet); color: var(--sheet-ink); border-radius: 4px; border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(16,24,40,.06);
  aspect-ratio: 8.5 / 11; max-width: 100%; padding: clamp(18px, 5%, 44px); display: flex; flex-direction: column; gap: clamp(10px, 2.4vw, 22px); overflow: hidden; }
.sheet .doc-title { font-size: clamp(22px, 4.2vw, 36px); font-weight: 700; margin: 0; line-height: 1.15; }
.sheet h2 { font-size: clamp(20px, 3.8vw, 32px); margin: 0; line-height: 1.2; padding-bottom: 8px; border-bottom: 4px solid var(--sheet-ink); }
.ln { display: grid; grid-template-columns: clamp(56px, 13vw, 110px) minmax(0, 1fr); gap: clamp(12px, 3vw, 26px); align-items: center;
  font-size: clamp(17px, 3.3vw, 28px); line-height: 1.3; }
.pic { aspect-ratio: 1; width: 100%; display: grid; place-items: center; border-radius: 14px; background: #e9f0f9; color: #1d4e89; padding: 14%; }
.pic svg { width: 100%; height: 100%; }
.ln.crisis .pic { background: #fbe3e1; color: #9d1d16; }
.pic.none { background: none; }
.tx { min-width: 0; overflow-wrap: anywhere; }
.tx strong { font-weight: 700; }
.num { font-weight: 700; margin-right: .35em; }
.box { display: inline-block; width: .9em; height: .9em; border: .14em solid var(--sheet-ink); border-radius: 3px; margin-right: .4em; vertical-align: -.08em; }
.ln.phone .tx { font-weight: 700; }
.ln.crisis .tx { font-weight: 700; color: #8f1d17; border: .16em solid #b3261e; border-radius: 10px; padding: .3em .45em; }
.foot { margin-top: auto; font-size: clamp(9px, 1.5vw, 12px); color: #555; border-top: 1px solid #bbb; padding-top: 6px; }
[contenteditable="true"]:hover { background: rgba(29,78,137,.08); border-radius: 4px; }
.example { font-size: 13px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <section class="drop" id="drop" aria-labelledby="up-h">
    <h1 id="up-h">Upload a Document</h1>
    <p>PDF, Word (.docx), a photo of a letter, or a text file</p>
    <div class="controls">
      <label class="filebtn primary" for="file">Choose a file</label>
      <input id="file" type="file" accept=".pdf,.docx,.txt,.md,image/png,image/jpeg,image/webp,application/pdf,text/plain">
      <select id="lang" aria-label="Handout language">
        <option value="">Choose language</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button id="stop" type="button" hidden>Stop</button>
    </div>
    <button id="pastebtn" class="linkbtn" type="button">or paste text</button>
    <div id="pastebox" hidden style="width:100%">
      <textarea id="src" aria-label="Document text" placeholder="Paste the document text here"></textarea>
      <div class="controls" style="margin-top:8px"><button id="go" class="primary" type="button">Make handout</button></div>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
  <p class="disclaimer"><strong>Do not upload real patient information.</strong> Remove names, dates of birth, record numbers and other personal details first. Check every handout before giving it to someone.</p>

  <div id="out"></div>
</div>

<script>
const RULES = "You rewrite health documents into aphasia-friendly versions.\n\nAphasia is a language disorder, usually after a stroke or brain injury. It makes reading hard. It does NOT affect intelligence. Write for an adult. Never sound childish.\n\nYour output is printed as a multi-page handout. Plan the pages first, then write each page.\n\n# Hard safety rules (never break these)\n\n1. Add nothing. Do not add medical advice, facts, numbers, names or instructions that are not in the original.\n2. Copy facts exactly. Names, dates, times, doses, addresses, phone numbers, emails and websites are copied character for character from the original. Do not reformat them (keep \"(919) 555-0142\" as \"(919) 555-0142\").\n3. Crisis and emergency information stays word for word and prominent. Numbers such as 911 and 988 get their own line with kind \"crisis\". Never shorten or soften crisis instructions.\n4. Do not convert validated screening questionnaires (for example PHQ-9, GAD-7). If the document contains one, leave it out and say so in \"notes_for_reviewer\", and suggest an aphasia-friendly tool made for that purpose (for example the SADQ-10 for depression).\n5. You may leave out details the reader does not need (record numbers, dates of birth, billing codes, legal fine print). List every fact you leave out in \"omitted\" with a short reason. Never leave out an action, a dose, a date or time the reader must keep, a phone number they need, or crisis information.\n6. If something in the original is unclear, keep it closer to the original wording and explain in \"notes_for_reviewer\". Never guess.\n7. Keep every action the reader must take (who, what, when). Shorter is good, but losing an action is a failure.\n\n# Writing rules\n\n- One topic per page. One to four short lines per page. A checklist page (kind \"checkbox\") may have up to six lines. Split longer lists across pages.\n- One idea per line. Short sentences: aim for 5 to 10 words, never more than 15.\n- Plain everyday words. Replace medical terms with simple words (\"speech therapy\" not \"outpatient speech-language pathology\"). If the medical word matters (for example a medicine name), keep it and explain it simply.\n- Bold one or two key words in each sentence using **double asterisks**. Do not bold whole sentences.\n- Talk to the reader directly: \"You have...\", \"Call...\", \"Take...\".\n- Use numbered steps (kind \"step\") for anything done in order. Two to four steps per page; numbering continues onto the next page. Do not type the numbers yourself.\n- Phone numbers go on their own line (kind \"phone\" or \"crisis\"), with only the number and at most a short label, e.g. \"Phone: (919) 555-0142\".\n- If the original is a form where the clinician picks options (results, diet levels, strategies), keep EVERY option as its own checkbox line so the clinician can tick the ones that apply. Use checkboxes (kind \"checkbox\") when a clinician should tick what applies, and blanks (kind \"blank\", written as \"________\") for names or details to fill in.\n- Suggest a picture for every line that matters: a short, concrete noun phrase that a symbol library can find (\"calendar\", \"pill\", \"phone\", \"doctor\", \"speech therapist\"). Use \"\" only for lines that need no picture.\n- Repeat the main message. The last page says what to do and who can help.\n- Write in the same language as the original unless told otherwise. Spanish output uses the same rules (\"usted\" form, plain words).\n\n# Output format\n\nReturn ONLY a JSON object, no other text, in this shape:\n\n{\n  \"title\": \"short plain title\",\n  \"language\": \"en\" or \"es\",\n  \"source\": \"name of the original document as given\",\n  \"pages\": [\n    {\n      \"topic\": \"one topic\",\n      \"lines\": [\n        {\"kind\": \"text\", \"text\": \"**Speech therapy** can help you **talk**.\", \"picture\": \"speech therapist\"},\n        {\"kind\": \"phone\", \"text\": \"Phone: (919) 555-0142\", \"picture\": \"phone\"}\n      ]\n    }\n  ],\n  \"omitted\": [\"MRN 00482913: record number, not needed by the reader\"],\n  \"notes_for_reviewer\": [\"anything unclear, or that the SLP should check\"]\n}\n\nAllowed \"kind\" values: \"text\", \"step\", \"phone\", \"crisis\", \"checkbox\", \"blank\".\n";

-0163 con al menos 24 horas de anticipación.", "target": {"title": "Su cita", "language": "es", "source": "Carta de cita (ejemplo inventado)", "pages": [{"topic": "Usted tiene una cita", "lines": [{"kind": "text", "text": "Usted tiene una **cita**.", "picture": "cita médica"}, {"kind": "text", "text": "Con la **Dra. Ana Morales**.", "picture": "doctora"}, {"kind": "text", "text": "En la **Clínica de Rehabilitación Central**.", "picture": "hospital"}]}, {"topic": "Cuándo", "lines": [{"kind": "text", "text": "**jueves 14 de enero de 2027**", "picture": "calendario"}, {"kind": "text", "text": "**2:15 p.m.**", "picture": "reloj"}]}, {"topic": "Llegue temprano", "lines": [{"kind": "text", "text": "Llegue **15 minutos antes**.", "picture": "reloj"}, {"kind": "text", "text": "Va a **llenar** unos **papeles**.", "picture": "formulario"}]}, {"topic": "¿No puede ir?", "lines": [{"kind": "text", "text": "¿Necesita **cancelar** o **cambiar** la cita?", "picture": "cancelar"}, {"kind": "text", "text": "**Llame** por lo menos **24 horas** antes.", "picture": "teléfono"}, {"kind": "phone", "text": "Teléfono: (919) 555-0163", "picture": "teléfono"}]}], "notes_for_reviewer": []}}];

nd": "text", "text": "**Do not stop** this medicine **suddenly**.", "picture": "stop", "icon": "hand-stop"}, {"kind": "text", "text": "Stopping can cause **seizures**.", "picture": "seizure", "icon": "brain"}]}, {"topic": "Side effects", "lines": [{"kind": "text", "text": "You may feel **sleepy** or **dizzy**.", "picture": "sleepy", "icon": "zzz"}, {"kind": "text", "text": "Your **mood** may change: **irritable** or **down**.", "picture": "sad", "icon": "mood-sad"}, {"kind": "text", "text": "**Tell** your **doctor** about mood changes.", "picture": "doctor", "icon": "stethoscope"}]}, {"topic": "Thoughts of hurting yourself?", "lines": [{"kind": "crisis", "text": "Call or text 988", "picture": "phone", "icon": "phone"}]}, {"topic": "Stay safe", "lines": [{"kind": "text", "text": "**No driving** until your doctor says it is **safe**.", "picture": "no driving", "icon": "car-off"}, {"kind": "text", "text": "Do **not swim** or **bathe alone**.", "picture": "bath", "icon": "bath"}]}, {"topic": "Call 911", "lines": [{"kind": "text", "text": "Seizure **longer** than **5 minutes**?", "picture": "clock", "icon": "clock"}, {"kind": "text", "text": "A **second** seizure **without waking up** in between?", "picture": "seizure", "icon": "brain"}, {"kind": "crisis", "text": "Call 911", "picture": "ambulance", "icon": "ambulance"}]}, {"topic": "Questions?", "lines": [{"kind": "phone", "text": "Phone: (919) 555-0125", "picture": "phone", "icon": "phone"}]}], "omitted": [], "notes_for_reviewer": []}};

function scoreDoc(doc) {
  const lang = doc.language || "en";
  const prose = allLines(doc).filter(([, l]) => READ_KINDS.has(l.kind))
    .map(([, l]) => stripMd(String(l.text || "").replace(/\*\*([^*]*[A-Z0-9ÁÉÍÓÚÑ][^*]*)\*\*/g, "")));
  const issues = [];
  (doc.pages || []).forEach((page, i) => {
    const lines = page.lines || [];
    const limit = lines.length && lines.every((l) => l.kind === "checkbox" || l.kind === "blank") ? 6 : 4;
    if (lines.length > limit) issues.push(`Page ${i + 1}: ${lines.length} lines (max ${limit})`);
    lines.forEach((l, j) => {
      const t = String(l.text || ""), n = words(stripMd(t)).length;
      if (READ_KINDS.has(l.kind) && n > 15) issues.push(`Page ${i + 1}, line ${j + 1}: ${n} words (max 15)`);
      if ((l.kind === "text" || l.kind === "step") && !t.includes("**")) issues.push(`Page ${i + 1}, line ${j + 1}: no bold key word`);
      if (READ_KINDS.has(l.kind) && PHONE_RE.test(t)) issues.push(`Page ${i + 1}, line ${j + 1}: phone number should be on its own line`);
      if (READ_KINDS.has(l.kind) && !l.picture) issues.push(`Page ${i + 1}, line ${j + 1}: no picture`);
      const factLine = /^\*\*[^*]+\*\*\.?$/.test(t.trim());
      const bolds = [...t.matchAll(/\*\*(.+?)\*\*/g)].map((m) => m[1])
        .filter((b) => !/[\d@]/.test(b) && !words(b).filter((w) => !CONNECTORS.has(w.toLowerCase())).every((w) => /^\p{Lu}/u.test(w)));
      if (bolds.length && !factLine && bolds.reduce((a, b) => a + words(b).length, 0) > Math.max(4, Math.floor(n / 2)))
        issues.push(`Page ${i + 1}, line ${j + 1}: too much bold`);
    });
  });
  const pages = doc.pages || [];
  if (pages.length && allLines(doc).some(([, l]) => l.kind === "phone" || l.kind === "crisis")) {
    const last = new Set((pages.at(-1).lines || []).map((l) => l.kind));
    if (!last.has("phone") && !last.has("crisis")) issues.push("Last page has no phone line (end with who can help)");
  }
  return { grade: gradeLevel(prose.join("\n"), lang), issues, pages: pages.length };
}

// ───────────────────────────── Reading the model's JSON (port of common.parse_model_json)
function closeBrackets(s) {
  const stack = []; let inStr = false, escp = false;
  for (const ch of s) {
    if (inStr) { escp = ch === "\\" && !escp; if (ch === '"' && !escp) inStr = false; continue; }
    if (ch === '"') inStr = true;
    else if (ch === "[" || ch === "{") stack.push(ch === "[" ? "]" : "}");
    else if ((ch === "]" || ch === "}") && stack.length) stack.pop();
  }
  if (inStr) throw new Error("cut off inside text");
  return s + stack.reverse().join("");
}
function parseModelJson(raw) {
  raw = raw.trim().replace(/^```(?:json)?\s*|\s*```$/g, "");
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  if (a < 0 || b < 0) throw new Error("no JSON found");
  try { return JSON.parse(raw.slice(a, b + 1)); }
  catch {
    const doc = JSON.parse(closeBrackets(raw.slice(a, b + 1)));
    (doc.notes_for_reviewer ||= []).push("The answer was cut off at the very end and closing brackets were added. Check the last page.");
    return doc;
  }
}


const ICON_RULE = "\n\n# Pictures\nEvery line has \"picture\" (a short word) AND \"icon\": the NAME of the drawing below that best shows that line's meaning. Use only names from this list, exactly as written. Use \"\" for both when a line needs no picture.\n\nDrawings (name: what it shows):\n" +
  Object.entries(ICONS).map(([n, v]) => `${n}: ${v.label}`).join("\n");
// The drawing for a line: the icon Claude chose, else the first drawing whose words match the picture word.
function drawingFor(line) {
  if (ICONS[line.icon]) return line.icon;
  const w = String(line.picture || line.icon || "").toLowerCase().trim();
  if (!w) return "";
  for (const [n, v] of Object.entries(ICONS)) if (v.label.toLowerCase().split(/,\s*/).includes(w) || n === w) return n;
  for (const [n, v] of Object.entries(ICONS)) if (w.split(/\s+/).some((x) => x.length > 3 && v.label.toLowerCase().includes(x))) return n;
  return "";
}
const svgFor = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n].svg}</svg>`;

// ───────────────────────────── Reading the uploaded file ─────────────────────────────
const $ = (id) => document.getElementById(id);
let sample = null, downloads = null, ctl = null;
const state = { doc: null, original: "", example: false };

async function pdfPages(file) {
  if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Reload the page, or paste the text instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  return pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
}
async function pdfText(pdf) {
  const out = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let line = "", lastY = null;
    for (const it of tc.items) {
      const y = it.transform?.[5];
      if (lastY !== null && Math.abs(y - lastY) > 2) { out.push(line); line = ""; }
      line += it.str + (it.hasEOL ? "\n" : ""); lastY = y;
    }
    out.push(line, "");
  }
  return out.join("\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function pdfImages(pdf, max) {
  const blobs = [];
  for (let i = 1; i <= Math.min(pdf.numPages, max); i++) {
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    blobs.push(await new Promise((r) => c.toBlob(r, "image/png")));
  }
  return blobs;
}
async function transcribe(images) {
  setStatus("Reading the picture of the document…");
  const { text } = await sample("These images are pages of a health document. Copy ALL of its text exactly, word for word, keeping every name, date, time, dose, address and phone number unchanged. Keep the reading order. Reply with only the text.",
    { images, signal: ctl.signal });
  return text.trim();
}
async function readFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf") || file.type === "application/pdf") {
    const pdf = await pdfPages(file);
    const text = await pdfText(pdf);
    if (text.replace(/\s/g, "").length > 80) return text;
    const max = (await sample.limits().catch(() => null))?.images?.maxCount || 5;
    return transcribe(await pdfImages(pdf, max));               // a scanned PDF has no text layer
  }
  if (name.endsWith(".docx")) {
    if (!window.mammoth) throw new Error("The Word reader didn't load. Reload the page, or paste the text instead.");
    return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value.trim();
  }
  if (file.type.startsWith("image/")) return transcribe([file]);
  return (await file.text()).trim();
}

// ───────────────────────────── Making the handout ─────────────────────────────
function userMessage(text, source, lang) {
  const target = lang ? `Write the output in ${lang === "es" ? "Spanish" : "English"}.\n` : "";
  return `${target}Source name: ${source}\n\nOriginal document:\n<<<\n${text.trim()}\n>>>`;
}
function buildPrompt(text, source, lang) {
  let p = RULES + ICON_RULE + "\n\n# Examples\n";
  EXAMPLES.forEach((ex, i) => { p += `\n## Example ${i + 1}: input\n${userMessage(ex.original, ex.source, "")}\n\n## Example ${i + 1}: output\n${JSON.stringify(ex.target)}\n`; });
  return p + `\n# Your task\n${userMessage(text, source, lang)}\n\nReply with only the JSON object.`;
}
function buildFixPrompt(text, doc, check) {
  const problems = problemList(check).map((p) => "- " + p).join("\n");
  return RULES + ICON_RULE + `\n\n# Your task\nA handout was made from the original below and the safety check found problems. Fix ONLY these and keep everything else the same. A missing fact must be copied exactly, or listed in "omitted" with a reason if the reader does not need it.\n\nProblems:\n${problems}\n\nOriginal document:\n<<<\n${text.trim()}\n>>>\n\nCurrent handout JSON:\n${JSON.stringify(doc)}\n\nReply with only the corrected JSON object.`;
}
function problemList(check) {
  return [
    ...check.facts.filter((f) => f.status === "missing").map((f) => `Missing ${f.type}: "${f.value}"`),
    ...check.facts.filter((f) => f.status === "reformatted").map((f) => `Changed ${f.type}: "${f.value}" is not copied exactly`),
    ...check.added.map((a) => `The number "${a}" is not in the original`),
    ...check.crisis.map((c) => c.replace("emergency box", "emergency (red) box")),
  ];
}
const ERR = {
  not_granted: "Claude isn't allowed on this page yet. Click the file button again and choose Allow when Claude asks.",
  sampling_disabled: "Claude isn't available for this account.",
  rate_limited: "Too many requests, or your Claude usage limit is reached. Wait a minute and try again.",
  session_expired: "Your Claude sign-in expired. Sign in again and try again.",
  refused: "Claude declined this document. Check it's a health document and try again.",
  prompt_too_large: "The document is too long. Upload one section at a time.",
  empty_completion: "Claude returned nothing. Try again.",
  invalid_json: "Claude's answer wasn't a complete handout. Try again.",
  image_rejected: "That image couldn't be read. Try a clearer photo (JPG or PNG).",
  images_unavailable: "Photos can't be read here. Upload a PDF or Word file, or paste the text.",
  upstream_error: "Claude couldn't be reached just now. Try again.",
  cancelled: "Stopped.",
};
function setStatus(msg, err) { const s = $("status"); s.textContent = msg || ""; s.className = "status" + (err ? " err" : ""); }
function fail(e) { setStatus(ERR[e?.code] || e?.message || String(e), e?.code !== "cancelled"); }
function busy(on) { $("stop").hidden = !on; $("file").disabled = on; $("go").disabled = on; const f = $("fix"); if (f) f.disabled = on; }

async function ensureClaude() {
  if (!sample) { try { sample = await window.claude?.use?.("sample"); } catch { sample = null; } }
  if (!sample) throw new Error("This page needs to be opened inside Claude (claude.ai or the Claude app) to make handouts.");
}
async function run(getText, sourceName) {
  ctl = new AbortController(); busy(true);
  try {
    await ensureClaude();
    setStatus("Reading the document…");
    const text = await getText();
    if (!text || text.replace(/\s/g, "").length < 20) throw new Error("No text was found in that file. Try another file, or paste the text.");
    setStatus("Writing the handout… (usually under a minute)");
    const { text: raw } = await sample(buildPrompt(text, sourceName, $("lang").value), {
      signal: ctl.signal,
      onText: ({ text: t }) => { const n = (t.match(/"topic"\s*:/g) || []).length; setStatus(n ? `Writing page ${n}…` : "Planning the pages…"); },
    });
    const doc = parseModelJson(raw);
    doc.source ||= sourceName;
    state.doc = doc; state.original = text; state.example = false;
    setStatus("");
    render();
    $("out").scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  } catch (e) { fail(e); }
  finally { busy(false); }
}
async function fixWithClaude(check) {
  ctl = new AbortController(); busy(true);
  try {
    await ensureClaude();
    setStatus("Fixing the flagged facts…");
    const { text: raw } = await sample(buildFixPrompt(state.original, state.doc, check), { signal: ctl.signal, cache: false });
    const doc = parseModelJson(raw); doc.source ||= state.doc.source;
    state.doc = doc; setStatus(""); render();
  } catch (e) { fail(e); }
  finally { busy(false); }
}

// ───────────────────────────── Showing the handout ─────────────────────────────
const mdToHtml = (t) => { const d = document.createElement("div"); d.textContent = String(t ?? ""); return d.innerHTML.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); };
function htmlToMd(el) {
  let s = "";
  for (const n of el.childNodes) s += n.nodeType === 3 ? n.textContent : (n.nodeName === "STRONG" || n.nodeName === "B") ? `**${n.textContent}**` : n.nodeName === "BR" ? " " : htmlToMd(n);
  return s.replace(/\*\*\*\*/g, "").replace(/\s+/g, " ").trim();
}
function sheetsHtml(doc, editable) {
  const ce = editable ? ' contenteditable="true" spellcheck="true"' : "";
  let step = 0, prevLast = null;
  return (doc.pages || []).map((p, pi) => {
    const lines = p.lines || [];
    if (!(lines[0]?.kind === "step" && prevLast === "step")) step = 0;
    prevLast = lines.at(-1)?.kind ?? null;
    const body = lines.map((l, li) => {
      const kind = l.kind || "text", name = drawingFor(l);
      const pic = name ? `<div class="pic" title="${mdToHtml(ICONS[name].label)}">${svgFor(name)}</div>` : `<div class="pic none"></div>`;
      const lead = kind === "step" ? `<span class="num">${++step}.</span>` : kind === "checkbox" ? `<span class="box"></span>` : "";
      return `<div class="ln ${kind}">${pic}<div class="tx">${lead}<span${ce} data-p="${pi}" data-l="${li}">${mdToHtml(l.text)}</span></div></div>`;
    }).join("");
    return `<article class="sheet">${pi === 0 ? `<p class="doc-title"${ce} data-title="1">${mdToHtml(doc.title)}</p>` : ""}
      <h2${ce} data-p="${pi}" data-topic="1">${mdToHtml(p.topic)}</h2>${body}
      <div class="foot">${doc.language === "es" ? "Basado en" : "Based on"}: ${mdToHtml(doc.source || "")} · Drawings: Tabler Icons (MIT)</div></article>`;
  }).join("");
}
function render() {
  const out = $("out"), doc = state.doc;
  if (!doc) { out.innerHTML = ""; return; }
  const check = factCheck(state.original, doc);
  const probs = problemList(check);
  out.innerHTML = `
    <div class="bar ${check.passed ? "pass" : "fail"}">
      <span class="verdict">${check.passed ? "✓ Every fact matches the original" : `✗ ${probs.length} fact problem${probs.length === 1 ? "" : "s"}`}${state.example ? " · example" : ""}</span>
      <span class="controls">
        ${check.passed ? "" : `<button id="fix" type="button">Fix with Claude</button>`}
        <button id="dl" type="button" class="primary">Download to print</button>
      </span>
    </div>
    ${check.passed ? "" : `<ul class="problems">${probs.map((p) => `<li>${mdToHtml(p)}</li>`).join("")}</ul>`}
    <div class="sheets" style="margin-top:16px">${sheetsHtml(doc, true)}</div>`;
  $("dl").onclick = download;
  if ($("fix")) $("fix").onclick = () => fixWithClaude(check);
  out.querySelectorAll("[contenteditable]").forEach((el) => el.addEventListener("blur", () => {
    if (el.dataset.title) state.doc.title = htmlToMd(el);
    else if (el.dataset.topic) state.doc.pages[+el.dataset.p].topic = htmlToMd(el);
    else state.doc.pages[+el.dataset.p].lines[+el.dataset.l].text = htmlToMd(el);
    render();
  }));
}

// ───────────────────────────── Download (a page that prints like the preview) ─────────────────────────────
function printable(doc) {
  const css = [...document.querySelectorAll("style")].map((s) => s.textContent).join("\n");
  const js = "";
  return `<!doctype html><html lang="${doc.language || "en"}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${mdToHtml(doc.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"><style>${css}
:root{color-scheme:light}body{background:#e9e9e9}.wrap{max-width:8.5in}.tip{font:14px system-ui;background:#fff8e1;border:1px solid #f0b400;border-radius:8px;padding:8px 12px}
@page{size:letter;margin:0}@media print{body{background:#fff}.wrap{padding:0;max-width:none;display:block}.tip{display:none}.sheet{box-shadow:none;border-radius:0;width:8.5in;height:11in;aspect-ratio:auto;padding:.6in;gap:22px;page-break-after:always}
.sheet .doc-title{font-size:36px}.sheet h2{font-size:32px}.ln{grid-template-columns:110px 1fr;gap:26px;font-size:28px}.pic{padding:16px}.foot{font-size:11px}}</style></head>
<body><div class="wrap"><p class="tip">${doc.language === "es" ? "Para imprimir: Archivo → Imprimir." : "To print: File → Print."}</p><div class="sheets">${sheetsHtml(doc, false)}</div></div><script>${js}<\/script></body></html>`;
}
async function download() {
  try { downloads ||= await window.claude?.use?.("downloads"); } catch {}
  if (!downloads) { setStatus("Downloads only work when the page is open inside Claude.", true); return; }
  const name = (String(state.doc.title || "handout").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "handout").slice(0, 60) + ".html";
  try { await downloads.save({ filename: name, data: printable(state.doc) }); setStatus("Saved. Open the file in your browser, then File → Print."); }
  catch (e) { if (e?.code !== "declined") setStatus("Couldn't save the file (" + (e?.code || "error") + ").", true); }
}

// ───────────────────────────── Wire up ─────────────────────────────
const drop = $("drop");
function takeFile(f) { if (f) run(() => readFile(f), f.name.replace(/\.[^.]+$/, "")); }
$("file").addEventListener("change", (e) => { takeFile(e.target.files?.[0]); e.target.value = ""; });
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => takeFile(e.dataTransfer?.files?.[0]));
$("pastebtn").onclick = () => { $("pastebox").hidden = !$("pastebox").hidden; if (!$("pastebox").hidden) $("src").focus(); };
$("go").onclick = () => run(async () => $("src").value, "Pasted document");
$("stop").onclick = () => ctl?.abort();
render();   // nothing to show until a file is uploaded
</script>
